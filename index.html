<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Holi 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background: linear-gradient(-45deg,#ff0080,#ff8c00,#40e0d0,#8a2be2);
    background-size:400% 400%;
    animation: gradient 10s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    text-align:center;
    color:white;
    z-index:2;
}

h1{
    font-size:3.5rem;
    text-shadow:0 0 20px white,0 0 40px yellow;
}

input{
    margin-top:15px;
    padding:10px;
    border-radius:20px;
    border:none;
    text-align:center;
}

button{
    margin-top:15px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:white;
    color:#ff0080;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    background:yellow;
    color:black;
}

canvas{
    position:absolute;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="card">
    <h1 id="greet">🌸 Happy Holi 🌸</h1>
    <input type="text" id="name" placeholder="Enter Your Name">
    <br>
    <button onclick="startHoli()">Celebrate 🎉</button>
</div>

<canvas id="fireworks"></canvas>

<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mp3">
</audio>

<script>
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function randomColor(){
    const colors=["#ff0080","#ff8c00","#40e0d0","#ff0","#00ff00","#8a2be2","#ff1493","#00ffff"];
    return colors[Math.floor(Math.random()*colors.length)];
}

function createFirework(x,y){
    for(let i=0;i<80;i++){
        particles.push({
            x:x,
            y:y,
            angle:Math.random()*2*Math.PI,
            speed:Math.random()*5+2,
            radius:2,
            color:randomColor(),
            life:100
        });
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach((p,i)=>{
        p.x+=Math.cos(p.angle)*p.speed;
        p.y+=Math.sin(p.angle)*p.speed;
        p.life--;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
        ctx.fillStyle=p.color;
        ctx.fill();
        if(p.life<=0) particles.splice(i,1);
    });
    requestAnimationFrame(animate);
}
animate();

document.addEventListener("click",(e)=>{
    createFirework(e.clientX,e.clientY);
});

/* Rainbow Mouse Trail */
document.addEventListener("mousemove",(e)=>{
    const trail=document.createElement("div");
    trail.style.position="absolute";
    trail.style.left=e.pageX+"px";
    trail.style.top=e.pageY+"px";
    trail.style.width="10px";
    trail.style.height="10px";
    trail.style.borderRadius="50%";
    trail.style.background=randomColor();
    trail.style.pointerEvents="none";
    document.body.appendChild(trail);
    setTimeout(()=>trail.remove(),500);
});

function startHoli(){
    let name=document.getElementById("name").value;
    if(name){
        document.getElementById("greet").innerText="🌸 Happy Holi "+name+" 🌸";
    }
    document.getElementById("music").play();
    createFirework(window.innerWidth/2,window.innerHeight/2);
}
</script>

</body>
</html>
