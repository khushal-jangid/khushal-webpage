<script>
  // ... existing JavaScript ...

  // State variables (add new ones)
  let torchActive = false;
  const contacts = {
    "mom": "8930312540",
    "dad": "9468401254"
  };

  // ... existing functions ...

  // New function to toggle torch
  async function toggleTorch(state) {
    try {
      if (!cameraStream) {
        // Open camera if not already open
        await openCamera();
      }
      
      const track = cameraStream.getVideoTracks()[0];
      if (!track) throw new Error("No video track available");
      
      if (track.getCapabilities().torch) {
        await track.applyConstraints({
          advanced: [{torch: state}]
        });
        torchActive = state;
        return true;
      } else {
        throw new Error("Torch not supported on this device");
      }
    } catch (error) {
      console.error("Torch error:", error);
      return false;
    }
  }

  // Update processCommand function
  async function processCommand(transcript) {
    const msg = transcript.toLowerCase();
    let response = "I'm not sure how to help with that.";
    
    // ... existing command processing ...

    else if (msg.includes("call")) {
      const contact = msg.replace("call", "").trim();
      if (contact) {
        // Check if it's a predefined contact
        if (contacts[contact]) {
          response = `Calling ${contact} at ${contacts[contact]}...`;
        } else {
          response = `Calling ${contact}...`;
        }
      } else {
        response = "Who would you like to call?";
      }
    }
    // Add torch commands
    else if (msg.includes("torch") || msg.includes("flashlight")) {
      if (msg.includes("on") || msg.includes("activate")) {
        const success = await toggleTorch(true);
        response = success ? "Torch activated!" : "Couldn't activate torch. Your device might not support this feature.";
      } 
      else if (msg.includes("off") || msg.includes("deactivate")) {
        const success = await toggleTorch(false);
        response = success ? "Torch deactivated!" : "Couldn't deactivate torch.";
      }
    }

    // ... rest of existing processing ...
  }

  // Update openCamera function to support torch
  async function openCamera(forTorch = false) {
    try {
      const constraints = {
        video: {
          facingMode: "environment",
          advanced: forTorch ? [{torch: true}] : []
        }
      };

      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      cameraStream = stream;
      cameraFeed.srcObject = stream;
      cameraContainer.style.display = "flex";
      capturedPhoto.style.display = "none";
      
      // If opening for torch, hide camera UI
      if (forTorch) {
        cameraContainer.style.display = "none";
      }
      
      return true;
    } catch (err) {
      output.textContent = "Failed to access camera: " + err.message;
      return false;
    }
  }

  // ... rest of existing JavaScript ...
</script>
