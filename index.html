<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friday AI - Offline</title>
  <style>
    body {
      background-color: #0b0f1a; color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; margin: 0;
    }
    button {
      padding: 12px 24px; font-size: 18px; border: none;
      border-radius: 30px; margin: 10px; cursor: pointer;
    }
    #talkBtn { background: #00bcd4; color: white; }
    #output { margin-top: 15px; font-size: 16px; text-align: center; }
    video, canvas, img {
      margin-top: 10px; max-width: 320px; border-radius: 10px; border: 2px solid #00bcd4;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <button id="talkBtn">🎙️ Talk to Friday</button>
  <div id="output">Say something to Friday...</div>
  <video id="cameraFeed" autoplay class="hidden"></video>
  <canvas id="cameraCanvas" class="hidden"></canvas>
  <img id="capturedPhoto" class="hidden" />

<script>
  const talkBtn = document.getElementById("talkBtn");
  const output = document.getElementById("output");
  const cameraFeed = document.getElementById("cameraFeed");
  const cameraCanvas = document.getElementById("cameraCanvas");
  const capturedPhoto = document.getElementById("capturedPhoto");

  let cameraStream = null;
  let recognitionActive = false;
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'en-US'; recognition.interimResults = false;

  function speak(text) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US'; window.speechSynthesis.speak(utter);
  }

  function listen() {
    if (recognitionActive) return;
    recognition.start();
    recognitionActive = true;
    output.textContent = "🎧 Listening...";
  }

  talkBtn.onclick = () => listen();

  recognition.onresult = (e) => {
    const msg = e.results[0][0].transcript.toLowerCase();
    output.textContent = `🗣️ You said: ${msg}`;
    recognitionActive = false;
    handleCommand(msg);
  };

  recognition.onend = () => {
    recognitionActive = false;
    setTimeout(() => listen(), 1500); // prevent repeat
  };

  function handleCommand(msg) {
    let res = "Sorry, I didn’t understand.";

    if (msg.includes("name")) res = "I am Friday, your assistant.";
    else if (msg.includes("time")) {
      const now = new Date();
      res = `It is ${now.toLocaleTimeString()} on ${now.toLocaleDateString()}`;
    }
    else if (msg.includes("battery")) {
      navigator.getBattery().then(b => {
        res = `Battery is at ${Math.round(b.level * 100)} percent.`;
        speak(res); output.textContent = res;
      }); return;
    }
    else if (msg.includes("camera")) { openCamera(); res = "Camera opened."; }
    else if (msg.includes("photo") || msg.includes("picture")) { takePhoto(); res = "Photo taken."; }
    else if (msg.includes("note")) {
      const note = prompt("Enter your note:");
      if (note) {
        const blob = new Blob([note], { type: 'text/plain' });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = `note_${Date.now()}.txt`; a.click();
        res = "Note saved.";
      } else res = "No note saved.";
    }
    else if (msg.includes("call")) {
      const number = prompt("Enter number to call:");
      if (number) { window.open(`tel:${number}`); res = `Calling ${number}`; }
    }
    else if (msg.includes("sms")) {
      const number = prompt("Enter number:");
      const text = prompt("Enter message:");
      if (number && text) { window.open(`sms:${number}?body=${encodeURIComponent(text)}`); res = "SMS sent."; }
    }
    else if (msg.includes("flashlight")) {
      document.body.style.backgroundColor =
        document.body.style.backgroundColor === "white" ? "#0b0f1a" : "white";
      res = "Toggled flashlight.";
    }

    output.textContent = `🤖 Friday: ${res}`;
    speak(res);
  }

  function openCamera() {
    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      cameraFeed.srcObject = stream;
      cameraStream = stream;
      cameraFeed.classList.remove("hidden");
    }).catch(err => alert("Camera error: " + err.message));
  }

  function takePhoto() {
    if (!cameraStream) return alert("Open camera first.");
    const ctx = cameraCanvas.getContext("2d");
    cameraCanvas.width = cameraFeed.videoWidth;
    cameraCanvas.height = cameraFeed.videoHeight;
    ctx.drawImage(cameraFeed, 0, 0);
    const imgData = cameraCanvas.toDataURL("image/png");
    capturedPhoto.src = imgData;
    capturedPhoto.classList.remove("hidden");

    const a = document.createElement("a");
    a.href = imgData;
    a.download = "photo.png";
    a.click();
  }

  window.onload = () => listen(); // auto mic start on load
</script>
</body>
</html>
