<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neo - AI Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.138.0/build/three.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #0b0f1a;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #avatar {
      width: 300px;
      height: 300px;
      margin-bottom: 20px;
    }
    #talkBtn {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #00bcd4;
      color: white;
      cursor: pointer;
    }
    #output {
      margin-top: 15px;
      font-size: 16px;
      text-align: center;
    }
    #cameraContainer {
      margin-top: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    video, canvas, img {
      max-width: 320px;
      border: 2px solid #00bcd4;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<canvas id="avatar"></canvas>
<button id="talkBtn">🎙️ Talk to Neo</button>
<div id="output">Say something to Neo...</div>
<div id="cameraContainer">
  <video id="cameraFeed" autoplay></video>
  <canvas id="cameraCanvas" style="display:none;"></canvas>
  <img id="capturedPhoto" />
</div>

<script>
const output = document.getElementById("output");
const talkBtn = document.getElementById("talkBtn");
const avatarCanvas = document.getElementById("avatar");
const cameraContainer = document.getElementById("cameraContainer");
const cameraFeed = document.getElementById("cameraFeed");
const cameraCanvas = document.getElementById("cameraCanvas");
const capturedPhoto = document.getElementById("capturedPhoto");
let cameraStream = null;

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = 'en-US';
recognition.interimResults = false;

function speak(text) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 1;
  utter.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  let maleVoice = voices.find(v => v.name === 'Google US English');
  if (!maleVoice) {
    maleVoice = voices.find(v =>
      v.lang === 'en-US' &&
      !v.name.toLowerCase().includes('female') &&
      (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('alex') || v.name.toLowerCase().includes('google'))
    );
  }
  if (maleVoice) utter.voice = maleVoice;
  window.speechSynthesis.speak(utter);
}

async function replyTo(message) {
  let response = "Sorry, I didn't get that.";
  const msg = message.toLowerCase();

  if (msg.includes("open settings")) {
    response = "Opening phone settings.";
    window.location.href = "intent:#Intent;action=android.settings.SETTINGS;end";
  } else if (msg.includes("open whatsapp")) {
    response = "Opening WhatsApp.";
    window.location.href = "whatsapp://";
  } else if (msg.includes("open phone") || msg.includes("dialer")) {
    response = "Opening phone dialer.";
    window.location.href = "tel:";
  } else if (msg.includes("open messages") || msg.includes("sms")) {
    response = "Opening messages.";
    window.location.href = "sms:";
  } else if (msg.includes("call") && msg.match(/\d{10}/)) {
    const number = msg.match(/\d{10}/)[0];
    response = `Calling ${number}`;
    window.location.href = `tel:${number}`;
  } else if (msg.includes("open camera")) {
    openCamera();
    response = "Camera opened.";
  } else if (msg.includes("close camera")) {
    closeCamera();
    response = "Camera closed.";
  } else if (msg.includes("take photo")) {
    takePhoto();
    response = "Photo captured.";
  } else if (msg.includes("time")) {
    const now = new Date();
    response = `The time is ${now.toLocaleTimeString()} on ${now.toLocaleDateString()}`;
  }

  output.textContent = `🤖 Neo: ${response}`;
  speak(response);
}

talkBtn.onclick = () => {
  output.textContent = "🎧 Listening...";
  recognition.start();
};

recognition.onresult = (event) => {
  const transcript = event.results[0][0].transcript;
  output.textContent = `🗣️ You said: ${transcript}`;
  replyTo(transcript);
};

function openCamera() {
  navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
    cameraStream = stream;
    cameraFeed.srcObject = stream;
    cameraFeed.play();
    cameraContainer.style.display = "flex";
    capturedPhoto.style.display = "none";
  }).catch(err => {
    alert("Failed to access camera: " + err.message);
  });
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraFeed.srcObject = null;
    cameraContainer.style.display = "none";
    capturedPhoto.style.display = "none";
    cameraStream = null;
  }
}

function takePhoto() {
  if (!cameraStream || !cameraFeed.videoWidth) {
    alert("Camera is not active or not accessible.");
    return;
  }
  const context = cameraCanvas.getContext("2d");
  cameraCanvas.width = cameraFeed.videoWidth;
  cameraCanvas.height = cameraFeed.videoHeight;
  context.drawImage(cameraFeed, 0, 0);
  const imageData = cameraCanvas.toDataURL("image/png");
  capturedPhoto.src = imageData;
  capturedPhoto.style.display = "block";
  const a = document.createElement("a");
  a.href = imageData;
  a.download = "photo.png";
  a.click();
}

// 3D Avatar
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: avatarCanvas, alpha: true });
renderer.setSize(300, 300);

const geometry = new THREE.SphereGeometry(1, 32, 32);
const material = new THREE.MeshStandardMaterial({ color: 0x00bcd4, emissive: 0x004e61 });
const avatar = new THREE.Mesh(geometry, material);
scene.add(avatar);

const light = new THREE.PointLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);

camera.position.z = 3;

function animate() {
  requestAnimationFrame(animate);
  avatar.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
